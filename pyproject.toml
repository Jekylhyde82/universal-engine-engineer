[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-engineer-performance-lab"
version = "1.0.1"
description = "Evidence-first benchmark runner for the Universal Engine / Engineer Performance Lab"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
performance-lab = "performance_lab.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests/performance-lab"]
python_files = ["test_*.py"]
