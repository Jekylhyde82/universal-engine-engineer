[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eupn-node"
version = "0.1.0"
description = "Certificate-authenticated durable node for the Universal Private Network"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eupn-node = "eupn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
