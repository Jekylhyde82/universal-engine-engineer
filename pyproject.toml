[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "universal-engine-core"
version = "0.1.0"
description = "Universal Engine core with governed acquisition, AFI fusion and provider-neutral lifecycle primitives"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]
[project.scripts]
uaie = "universal_engine.uaie:main"
uaie-lmstudio-catalog = "universal_engine.lmstudio_catalog:main"
uaie-lmstudio-status = "universal_engine.lmstudio_catalog:status_main"
uaie-lmstudio-inventory = "universal_engine.lmstudio:main"
uaie-lmstudio-model-yaml = "universal_engine.lmstudio_catalog:model_yaml_main"

[tool.setuptools.packages.find]
where = ["src"]
