[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-engine-core"
version = "0.1.0"
description = "Universal Engine runtime and acquisition capabilities"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
uaie = "universal_engine.uaie:main"
uaie-lmstudio = "universal_engine.lmstudio:main"

[tool.setuptools.packages.find]
where = ["src"]
