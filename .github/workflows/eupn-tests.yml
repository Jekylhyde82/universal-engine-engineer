name: EUPN tests
on:
  push:
    paths:
      - "src/eupn/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/eupn-tests.yml"
  pull_request:
    paths:
      - "src/eupn/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/eupn-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
