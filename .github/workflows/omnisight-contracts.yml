name: OMNISIGHT PRIME contract validation

# Validates schemas, the VEF ledger, envelope mapping and world-model integration.

on:
  push:
    branches:
      - "architecture/omnisight-ninefold-intrinsic-v0.1"
  pull_request:
    branches:
      - "architecture/vision-dd-production-spec"
    paths:
      - "schemas/omnisight/**"
      - "runtime/omnisight_evidence/**"
      - "architecture/9_FOLD_OMNI_*"
      - "architecture/9-fold-omni/**"
      - ".github/workflows/omnisight-contracts.yml"
      - ".github/workflows/python-core.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/runtime/**"
      - "starwire/**"

permissions:
  contents: read

concurrency:
  group: omnisight-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json-schema-contracts:
    name: JSON Schema and contract fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schemas/omnisight/requirements-test.txt
      - name: Install pinned test validator
        run: python -m pip install -r schemas/omnisight/requirements-test.txt
      - name: Validate schema definitions and fixtures
        run: python -m unittest discover -s schemas/omnisight/tests -v
      - name: Install provider-neutral runtime package
        run: python -m pip install .
      - name: Compile provider-neutral runtime
        run: python -m compileall -q src tests
      - name: Validate provider-neutral runtime tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate STARWIRE discovery and extraction
        run: python -m unittest discover -s starwire/tests -v
      - name: Validate unified capability catalogue
        run: python -m unittest discover -s architecture/9-fold-omni/tests -v
      - name: Validate evidence-ledger runtime
        env:
          PYTHONPATH: runtime
        run: python -m unittest discover -s runtime/omnisight_evidence/tests -v
