name: Repository Capability Scout checks

on:
  pull_request:
    paths:
      - "tools/repository-capability-scout/**"
      - "tests/repository-capability-scout.test.mjs"
      - ".github/workflows/repository-capability-scout.yml"
  push:
    branches:
      - "production/repository-capability-scout-hardening-v0.2"

permissions:
  contents: read

jobs:
  static-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test tests/repository-capability-scout.test.mjs
