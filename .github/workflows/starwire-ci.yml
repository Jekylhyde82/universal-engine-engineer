name: STARWIRE CI
on:
  pull_request:
    paths: ['starwire/**', 'pyproject.toml', '.github/workflows/starwire-ci.yml']
  push:
    branches: [main]
    paths: ['starwire/**', 'pyproject.toml', '.github/workflows/starwire-ci.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library test suite
        run: python -m unittest discover -s starwire/tests -v
