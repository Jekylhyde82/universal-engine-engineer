name: UAIE Android build
on:
  pull_request:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/android-build.yml"]
  push:
    branches: ["android/uaie-client-v0.1"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uaie-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      - name: Install and verify pinned Gradle
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip --output /tmp/gradle.zip
          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  /tmp/gradle.zip" | sha256sum --check
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.6.0/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaie-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
