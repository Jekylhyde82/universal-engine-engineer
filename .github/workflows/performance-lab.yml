name: Performance Lab validation

on:
  pull_request:
    paths:
      - "performance_lab/**"
      - "tests/performance-lab/**"
      - "pyproject.toml"
      - ".github/workflows/performance-lab.yml"
  push:
    branches:
      - "performance-lab/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e ".[test]"
      - run: performance-lab validate --records tests/performance-lab
      - run: pytest -q
