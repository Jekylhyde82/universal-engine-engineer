name: NINEFOLD AFI PRIME runtime proof of capability

on:
  push:
    branches:
      - "architecture/omnisight-ninefold-intrinsic-v0.1"
  pull_request:
    branches:
      - "architecture/vision-dd-production-spec"
    paths:
      - "packages/ninefold-fusion-runtime/**"
      - "docs/architecture/ninefold-intrinsic/**"
      - "tools/architecture/**"
      - ".github/workflows/ninefold-fusion-runtime.yml"

concurrency:
  group: ninefold-runtime-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate NINEFOLD INTRINSIC capability lineage registry
        run: node tools/architecture/validate-ninefold-registry.mjs
      - name: Check runtime JavaScript syntax
        working-directory: packages/ninefold-fusion-runtime
        run: npm run check
      - name: Run nine-instance isolation and fault-containment tests
        working-directory: packages/ninefold-fusion-runtime
        run: npm test
